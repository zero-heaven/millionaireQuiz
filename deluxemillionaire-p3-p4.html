<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>榮譽富翁 — 豪華版</title>
<style>
/* Unvisited link */
a:link {
    color: var(--text-main);
    font-family: 'Noto Sans TC', "Segoe UI", Roboto, sans-serif;
    font-size: 1.4rem;
    font-weight: 600;
    text-decoration: none;
}

/* Visited link */
a:visited {
    color: white;
}

/* Mouse over link */
a:hover {
    color: green;
    text-decoration: none;
}

/* Selected/Clicked link */
a:active {
    color: white;
    text-decoration: none;
}    

:root{
  --bg-1:#04101a;
  --bg-2:#071428;
  --card: rgba(8,12,20,0.62);
  --accent:#00d2ff;
  --gold:#d4af37;
  --muted:#9aa3b2;
  --glass: rgba(255,255,255,0.03);
  --radius:14px;
  --shadow-lg: 0 20px 80px rgba(2,6,23,0.6);
  --shadow-md: 0 10px 30px rgba(2,6,23,0.45);
}

/* Reset & base */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  background:
    radial-gradient(900px 400px at 10% 10%, rgba(0,210,255,0.03), transparent),
    linear-gradient(180deg,var(--bg-1),var(--bg-2));
  color:#e6eef8;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding:20px;
  display:flex;
  justify-content:center;
}

/* Container */
.container{
  width:100%;
  max-width:1200px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

/* Header: status + timer in one compact bar centered */
.header{display:flex; justify-content:center;}
.header-inner{
  width:100%;
  max-width:1200px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px;
}
.status-timer{
  display:flex;
  align-items:center;
  gap:18px;
  background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.01));
  padding:14px 18px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.03);
  box-shadow:var(--shadow-lg);
  min-width:0;
}
.status-cols{display:flex;gap:11px;align-items:center;min-width:0}
.status-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.status-col .label{font-size:12px;color:var(--muted);letter-spacing:0.6px}
.status-col .value{font-weight:900;color:#fff;white-space:nowrap;font-size:16px}

/* Timer */
.timer-box{
  background:linear-gradient(180deg,#ff7b7b,#e74c3c);
  padding:10px 14px;border-radius:12px;font-weight:900;color:#fff;min-width:72px;text-align:center;
  box-shadow:0 8px 30px rgba(231,76,60,0.14);
  font-size:18px;
}

/* Layout grid */
.app{
  width:100%;
  display:grid;
  grid-template-columns: 1fr 160px;
  gap:9px;
  align-items:start;
}
@media (max-width:980px){ .app{ grid-template-columns:1fr } }

/* Left column */
.left-col{display:flex;flex-direction:column; align-items:center; justify-content:center;gap:9px}
.lifelines{display:flex;gap:6px;flex-wrap:wrap}
.lifeline-btn{
  background:linear-gradient(180deg,#0f1724,#0b1220);
  border:1px solid rgba(255,255,255,0.3);
  color:#e6eef8;padding:10px 14px;border-radius:12px;cursor:pointer;
  box-shadow:var(--shadow-md);transition:transform .12s,opacity .12s;
}
.lifeline-btn:active{transform:translateY(2px)}
.lifeline-btn:disabled{opacity:.45;cursor:not-allowed}

/* Quiz card (deluxe) */
.quiz-card{
  position:relative;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow-lg);
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.02);
}

/* Decorative gold glow */
.quiz-card::after{
  content:"";
  position:absolute;left:-120px;top:-120px;width:400px;height:420px;border-radius:50%;
  background: radial-gradient(circle at 30% 30%, rgba(212,175,55,0.16), transparent 30%);
  pointer-events:none;
}

/* Question & options */
.question-box{
  font-size:20px;padding:9px;border-radius:12px;background:linear-gradient(90deg, rgba(0,210,255,0.2), rgba(212,175,55,0.1));
  margin-bottom:14px;min-height:96px;border:1px solid rgba(255,255,255,0.02);
  display:flex;align-items:center;
}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){ .options-grid{grid-template-columns:1fr 1fr;} }

.option-btn{
  background:linear-gradient(180deg,#1859ba,#0b1220);
  border:2px solid rgba(255,255,255,0.3);
  color:#e6eef8;padding:14px;border-radius:12px;cursor:pointer;text-align:left;font-size:16px;
  transition:transform .12s,box-shadow .12s,border-color .12s,background .18s;
  box-shadow:0 12px 36px rgba(2,6,23,0.45);
}
.option-btn:hover{transform:translateY(-6px);box-shadow:0 22px 48px rgba(2,6,23,0.6)}
.option-btn.correct{border-color:rgba(88,214,141,0.95);background:linear-gradient(90deg,#063b1f,#0b3b2b)}
.option-btn.wrong{border-color:rgba(255,99,99,0.95);background:linear-gradient(90deg,#3b0b0b,#5a0b0b)}
.option-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}

/* Controls */
.control-panel{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.ctrl-btn{background:linear-gradient(180deg,#233f66,#111827);border:0;color:#fff;padding:6px 8px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow-md);font-weight:700}
.ctrl-btn.secondary{background:linear-gradient(180deg,#1414e3,#2b2b6b)}

/* Right column: money tree */
.right-col{
  background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.00));
  padding:6px;border-radius:12px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.02);
  box-shadow:var(--shadow-lg);
}
.money-tree{display:flex;flex-direction:column;gap:5px;align-items:flex-end;padding-right:6px;max-height:calc(100vh - 220px);overflow:auto}
.money-item{width:100%;display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:2px 4px;border-radius:12px;color:#cbd5e1;opacity:.8;transition:all .25s}
.money-item .label{background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:4px 6px;border-radius:10px;font-weight:700}
.money-item.active{background:linear-gradient(90deg, rgba(0,210,255,0.6), rgba(212,175,55,0.04));opacity:1;transform:translateX(-10px);box-shadow:0 12px 36px rgba(0,210,255,0.04)}
.money-item.winner{background:linear-gradient(90deg,#0b3b2b,#083b12);color:var(--gold);font-weight:900;box-shadow:0 14px 48px rgba(212,175,55,0.08)}

/* Modal & table */ 
.modal{position:fixed;left:0;top:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:60}
.modal .modal-content{background:var(--card);padding:9px;border-radius:12px;min-width:320px;max-width:820px;color:#e6eef8;display:flex;flex-direction:column;max-height:88vh;overflow:hidden}
.modal .modal-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:8px}
.rank-table{width:100%;border-collapse:collapse;margin-top:10px}
.rank-table th,.rank-table td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.3);text-align:left;font-size:14px}
#rank-tbody-wrapper{max-height:56vh;overflow-y:auto;padding-right:6px}

/* Save modal visual header */
#modal-save-name .save-visual{height:140px;border-radius:10px;background-size:cover;background-position:center;margin-bottom:12px;opacity:0.95;border:1px solid rgba(255,255,255,0.03)}

/* confetti */
#confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:70;touch-action:none}

/* Mobile: hide money tree (do not move it below content) */
@media (max-width:980px){
  .right-col{display:none !important}
  .status-timer{flex-wrap:wrap;justify-content:center}
}

/* small tweaks */
@media (max-width:600px){
  .question-box{font-size:18px;padding:12px}
  .option-btn{font-size:15px;padding:12px}
  body{padding:12px}
}
</style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header" role="banner">
      <div class="header-inner">
        <div class="status-timer" role="status" aria-live="polite">
          <div class="status-cols">
            <div class="status-col">
              <div class="label">關卡</div>
              <div class="value" id="current-step">1/15</div>
            </div>
            <div class="status-col">
              <div class="label">獎金</div>
              <div class="value" id="current-prize">$1,000</div>
            </div>
          </div>
          <div style="width:18px"></div>
            <div class="timer-box" id="timer" onclick="togglePause()">30</div>        </div>
      </div>
    </header>

    <!-- Main app -->
    <main class="app" role="main">
      <!-- Left: game -->
      <section class="left-col">
        <div class="lifelines">
          <button class="lifeline-btn" id="ll-5050" onclick="trigger5050()">50:50</button>
          <button class="lifeline-btn" id="ll-friend" onclick="triggerFriend()">📞 智囊團</button>
          <button class="lifeline-btn" id="ll-audience" onclick="triggerAudience()">👥 觀眾團</button>
        </div>

        <div class="quiz-card">
          <div class="question-box" id="question-text">正在載入題目...</div>

          <div class="options-grid">
            <button class="option-btn" id="opt-0" onclick="checkAnswer(0)">A: <span id="text-0"></span></button>
            <button class="option-btn" id="opt-1" onclick="checkAnswer(1)">B: <span id="text-1"></span></button>
            <button class="option-btn" id="opt-2" onclick="checkAnswer(2)">C: <span id="text-2"></span></button>
            <button class="option-btn" id="opt-3" onclick="checkAnswer(3)">D: <span id="text-3"></span></button>
          </div>

          <div class="control-panel">
            <button id="takeaway-btn" class="ctrl-btn" onclick="takeaway()">見好就收 (中途拿獎金)</button>
            <button class="ctrl-btn" onclick="openRankModal()">🏆 查看前十名排行榜</button>
            <button class="ctrl-btn secondary" onclick="resetGame()">重新開始</button>
          </div>
        </div>
      </section>

      <!-- Right: money tree -->
      <aside class="right-col" aria-hidden="false">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-weight:900;color:var(--gold)">金錢樹</div>
          <div style="font-size:12px;color:var(--muted)">目前關卡會高亮</div>
        </div>
        <div class="money-tree" id="money-tree" role="list"></div>
      </aside>
    </main>
  </div>

  <!-- Audience Modal -->
  <div class="modal" id="modal-audience">
    <div class="modal-content">
      <h3>👥 觀眾動態投票</h3>
      <div class="modal-scroll" style="padding-top:8px">
        <div style="display:flex; justify-content:space-around; align-items:flex-end; height:120px; border-bottom:2px solid #3b3b98; margin:15px 0;">
          <div><div id="bar-0" style="height:0;background:#3b3b98;color:#fff;width:36px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px">0%</div><div style="text-align:center">A</div></div>
          <div><div id="bar-1" style="height:0;background:#3b3b98;color:#fff;width:36px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px">0%</div><div style="text-align:center">B</div></div>
          <div><div id="bar-2" style="height:0;background:#3b3b98;color:#fff;width:36px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px">0%</div><div style="text-align:center">C</div></div>
          <div><div id="bar-3" style="height:0;background:#3b3b98;color:#fff;width:36px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px">0%</div><div style="text-align:center">D</div></div>
        </div>
        <div style="display:flex;justify-content:flex-end"><button class="ctrl-btn secondary" onclick="closeModal('modal-audience')">返回</button></div>
      </div>
    </div>
  </div>

  <!-- Friend Modal -->
  <div class="modal" id="modal-friend">
    <div class="modal-content">
      <h3>📞 智囊團</h3>
      <div class="modal-scroll" style="padding-top:8px">
        <p id="friend-response" style="font-style:italic;margin:18px 0"></p>
        <div style="display:flex;justify-content:flex-end"><button class="ctrl-btn secondary" onclick="closeModal('modal-friend')">掛斷</button></div>
      </div>
    </div>
  </div>

  <!-- Rank Modal -->
  <div class="modal" id="modal-rank">
    <div class="modal-content">
      <h3 style="color:var(--gold);margin:0">🏆 榮譽富翁排行榜 (前十名)</h3>
      <div id="rank-tbody-wrapper" class="modal-scroll">
        <table class="rank-table">
          <thead><tr><th>名次</th><th>玩家名稱</th><th>最高獎金</th><th>題數</th><th>日期</th></tr></thead>
          <tbody id="rank-tbody"></tbody>
        </table>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
        <button class="ctrl-btn" onclick="exportRankings()">📤 匯出</button>
        <button class="ctrl-btn" onclick="document.getElementById('import-file').click()">📥 匯入</button>
        <button class="ctrl-btn" onclick="clearRankings()">🗑️ 清除</button>
        <input type="file" id="import-file" style="display:none" onchange="importRankings(this)">
        <button class="ctrl-btn secondary" onclick="closeModal('modal-rank')">關閉</button>
      </div>
    </div>
  </div>

  <!-- Save Modal -->
  <div class="modal" id="modal-save-name">
    <div class="modal-content">
      <div class="save-visual" aria-hidden="true"></div>
      <h3>儲存成績</h3>
      <div id="save-summary" style="color:var(--muted);margin-top:6px"></div>
      <div class="modal-scroll" style="padding-top:8px">
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
          <input id="player-name" type="text" placeholder="輸入玩家名稱 (預設：匿名玩家)" style="flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#e6eef8" />
          <button class="ctrl-btn" onclick="confirmSaveName()">儲存</button>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="ctrl-btn" onclick="skipSave()">不儲存</button>
          <button class="ctrl-btn" onclick="resetAfterEnd()">再玩一次</button>
        </div>
      </div>
    </div>
  </div>

  <canvas id="confetti"></canvas>

<script>
/* ============================
   Storage keys & helpers
   ============================ */
const STORAGE_KEY = 'millionaire_rankings';
const LEGACY_KEY = 'mill_ranks';
const LAST_KEY = 'millionaire_last_result';

function storageAvailable(){
  try{ const k='__s'; localStorage.setItem(k,k); localStorage.removeItem(k); return true; }catch(e){ return false; }
}
function migrateLegacyIfAny(){
  try{
    const legacy = localStorage.getItem(LEGACY_KEY);
    const current = localStorage.getItem(STORAGE_KEY);
    if(legacy && !current){
      localStorage.setItem(STORAGE_KEY, legacy);
      localStorage.removeItem(LEGACY_KEY);
    }
  }catch(e){}
}
function getRankings(){
  if(!storageAvailable()) return [];
  try{ migrateLegacyIfAny(); const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
}
function saveRankings(arr){
  if(!storageAvailable()) return;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }catch(e){}
}
function getLastResult(){ if(!storageAvailable()) return null; try{ const raw = localStorage.getItem(LAST_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function saveLastResult(obj){ if(!storageAvailable()) return; try{ localStorage.setItem(LAST_KEY, JSON.stringify(obj)); }catch(e){} }

/* ============================
   Data & state
   ============================ */
const millionaireDataBank = [
  { "question": "【小三至小四 數學】計算 125 × 8 的答案是多少？", "answers": ["100", "800", "1000", "1200"], "correct": 2 },
  { "question": "【小三至小四 數學】把一個西瓜平均切成 8 份，小明吃了 3 份，他吃了這個西瓜的幾分之幾？", "answers": ["1/3", "3/8", "5/8", "1/8"], "correct": 1 },
  { "question": "【小三至小四 數學】一個正方形的周長是 36 厘米，它的邊長是多少厘米？", "answers": ["6 厘米", "9 厘米", "12 厘米", "18 厘米"], "correct": 1 },
  { "question": "【小三至小四 數學】上午 9 時 45 分到上午 10 時 15 分，一共經過了多少分鐘？", "answers": ["20 分鐘", "30 分鐘", "40 分鐘", "45 分鐘"], "correct": 1 },
  { "question": "【小三至小四 數學】下列哪一個圖形「沒有」直角？", "answers": ["正方形", "長方形", "直角三角形", "等邊三角形"], "correct": 3 },
  { "question": "【小三至小四 數學】小華有 150 元，買故事書用去 68 元，買文具用去 32 元，他還剩多少元？", "answers": ["50 元", "60 元", "70 元", "80 元"], "correct": 0 },
  { "question": "【小三至小四 數學】在數字 5843 中，百位數的「8」代表多少？", "answers": ["8", "80", "800", "8000"], "correct": 2 },
  { "question": "【小三至小四 數學】除法算式 45 ÷ 6 的商和餘數分別是多少？", "answers": ["商 7 餘 3", "商 6 餘 9", "商 7 餘 2", "商 8 餘 1"], "correct": 0 },
  { "question": "【小三至小四 數學】一個長方形的長是 10 厘米，寬是 5 厘米，它的周長是多少厘米？", "answers": ["15 厘米", "20 厘米", "30 厘米", "50 厘米"], "correct": 2 },
  { "question": "【小三至小四 數學】下列分數中，哪一個的值最大？", "answers": ["1/2", "1/4", "1/6", "1/8"], "correct": 0 },
  { "question": "【小三至小四 數學】一條繩子長 2 米，剪去 80 厘米後，還剩下多少厘米？", "answers": ["20 厘米", "60 厘米", "120 厘米", "180 厘米"], "correct": 2 },
  { "question": "【小三至小四 數學】小明每天看書 15 頁，連續看了兩個星期，他一共看了多少頁？", "answers": ["30 頁", "105 頁", "150 頁", "210 頁"], "correct": 3 },
  { "question": "【小三至小四 數學】下列哪一個西曆年份是閏年（平年有365天，閏年有366天）？", "answers": ["2021 年", "2022 年", "2023 年", "2024 年"], "correct": 3 },
  { "question": "【小三至小四 數學】5 個千、3 個百和 8 個一組成的四位數是多少？", "answers": ["538", "5380", "5038", "5308"], "correct": 3 },
  { "question": "【小三至小四 數學】汽水每箱有 24 瓶，運來 6 箱，一共運來汽水多少瓶？", "answers": ["30 瓶", "124 瓶", "144 瓶", "164 瓶"], "correct": 2 },
  { "question": "【小三至小四 數學】一個圓規的價格是 12 元 5 角，付一張 20 元鈔票，應找回多少？", "answers": ["7 元", "7 元 5 角", "8 元 5 角", "8 元"], "correct": 1 },
  { "question": "【小三至小四 數學】將 0.7 化成分數是多少？", "answers": ["7/100", "1/7", "7/10", "7/1"], "correct": 2 },
  { "question": "【小三至小四 數學】小紅下午 2 時 30 分開始做功課，下午 4 時正完成，她做功課用了多久？", "answers": ["1 小時", "1 小時 30 分鐘", "2 小時", "2 小時 30 分鐘"], "correct": 1 },
  { "question": "【小三至小四 數學】兩條直線互相垂直相交，會形成四個什麼角？", "answers": ["銳角", "直角", "鈍角", "平角"], "correct": 1 },
  { "question": "【小三至小四 數學】學校禮堂每排有 18 個座位，一共有 20 排，全禮堂有多少個座位？", "answers": ["38 個", "180 個", "360 個", "400 個"], "correct": 2 },

const moneyScale = [1000,2000,3000,5000,10000,20000,30000,40000,60000,100000,150000,250000,500000,750000,1000000];

let gameQuestions = [], currentLevel = 0, currentQuestionObj = null, safeLine = 0, timerInterval = null, timeLeft = 30, audioCtx = null;
let pendingFinalPrize = 0;

/* ============================
   Audio helpers
   ============================ */
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq,type,duration){ initAudio(); try{ const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type=type; osc.frequency.value=freq; gain.gain.setValueAtTime(0.05,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.00001,audioCtx.currentTime+duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+duration);}catch(e){}}
function playSound(style){ if(style==='correct'){ playTone(523.25,'sine',0.2); setTimeout(()=>playTone(659.25,'sine',0.3),120);} else if(style==='wrong'){ playTone(180,'sawtooth',0.5);} else if(style==='lifeline'){ playTone(440,'triangle',0.2);} }

/* ============================
   Helpers & UI
   ============================ */
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"'`=\/]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'}[c])); }
function openModal(id){ const m=document.getElementById(id); if(!m) return; m.style.display='flex'; const s=m.querySelector('.modal-scroll'); if(s) s.scrollTop=0; const f=m.querySelector('input,button,[tabindex]'); if(f) f.focus(); }
function closeModal(id){ const m=document.getElementById(id); if(!m) return; m.style.display='none'; }

/* ============================
   Money tree UI
   ============================ */
function renderMoneyTree(){
  const container = document.getElementById('money-tree');
  container.innerHTML = '';
  for(let i=moneyScale.length-1;i>=0;i--){
    const div = document.createElement('div');
    div.className = 'money-item' + (i===currentLevel ? ' active' : '') + (i===moneyScale.length-1 ? ' winner' : '');
    div.dataset.index = i;
    div.innerHTML = `<div class="label">$${moneyScale[i].toLocaleString()}</div>`;
    container.appendChild(div);
  }
}
function highlightMoneyTree(){
  document.querySelectorAll('.money-item').forEach(el=>{
    const idx = Number(el.dataset.index);
    if(idx === currentLevel) el.classList.add('active'); else el.classList.remove('active');
  });
}

/* ============================
   Game lifecycle
   ============================ */
function shuffleQuestions(){ const pool=[...millionaireDataBank]; while(pool.length<15) pool.push(...millionaireDataBank); return pool.sort(()=>0.5-Math.random()).slice(0,15); }

function resetGame(){
  isPaused = false;
  clearInterval(timerInterval);
  gameQuestions = shuffleQuestions();
  currentLevel = 0; safeLine = 0; pendingFinalPrize = 0;
  document.getElementById('ll-5050').disabled=false;
  document.getElementById('ll-friend').disabled=false;
  document.getElementById('ll-audience').disabled=false;
  const opts = document.querySelectorAll('.option-btn');
  opts.forEach(b=>{ b.disabled=false; b.className='option-btn'; });
  document.getElementById('takeaway-btn').disabled = true;
  renderMoneyTree();
  loadQuestion();
}

function resetAfterEnd(){ closeModal('modal-save-name'); closeModal('modal-rank'); resetGame(); }

/* Pause/Resume support */
let isPaused = false;

function togglePause(){
  isPaused = !isPaused;
  const timerEl = document.getElementById('timer');
  if(isPaused){
    timerEl.style.background = "linear-gradient(180deg,#3b3b98,#2b2b6b)";
    timerEl.innerText = "⏸️ " + timeLeft;
  } else {
    timerEl.style.background = "linear-gradient(180deg,#ff7b7b,#e74c3c)";
    timerEl.innerText = timeLeft;
  }
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 30;
  const timerEl = document.getElementById("timer");
  timerEl.innerText = timeLeft;
  timerEl.style.background = "#e74c3c";
  timerInterval = setInterval(()=>{
if(!isPaused){
  timeLeft--;
  timerEl.innerText = timeLeft;
  if(timeLeft <= 5){ timerEl.style.background = "#ff0000"; playTone(330,'sine',0.08); }
  if(timeLeft <= 0){
    clearInterval(timerInterval);
    playSound('wrong');
    const prize = safeLine > 0 ? safeLine : 0;
    endGame(false,false, prize);
  }
}
  },1000);
}

function loadQuestion(){
  if(!gameQuestions || gameQuestions.length===0) gameQuestions = shuffleQuestions();
  currentQuestionObj = gameQuestions[currentLevel];
  document.getElementById("current-step").innerText = (currentLevel + 1) + '/15';
  document.getElementById("current-prize").innerText = '$' + moneyScale[currentLevel].toLocaleString();
  document.getElementById("question-text").innerText = currentQuestionObj.question;
  for(let i=0;i<4;i++){
    const btn = document.getElementById(`opt-${i}`);
    btn.className = "option-btn";
    btn.disabled = false;
    document.getElementById(`text-${i}`).innerText = currentQuestionObj.answers[i];
  }
  highlightMoneyTree();
  startTimer();
}

/* ============================
   Answer & lifelines
   ============================ */
function checkAnswer(selectedIndex){
  isPaused = false;
  clearInterval(timerInterval);
  const correctIndex = currentQuestionObj.correct;
  if(selectedIndex === correctIndex){
    playSound('correct');
    document.getElementById('takeaway-btn').disabled = false;
    document.getElementById(`opt-${selectedIndex}`).classList.add("correct");
    setTimeout(()=>{
      currentLevel++;
      if(currentLevel === 5 || currentLevel === 10){
        safeLine = moneyScale[currentLevel - 1];
        // no header safeline display per request
        alert(`🎉 恭喜！你已達到安全線，最低保證獎金為 $${safeLine.toLocaleString()}`);
      }
      if(currentLevel >= moneyScale.length){
        triggerConfetti();
        endGame(true,true, moneyScale[moneyScale.length-1]);
      } else {
        loadQuestion();
      }
    },1200);
  } else {
    playSound('wrong');
    document.getElementById(`opt-${selectedIndex}`).classList.add("wrong");
    document.getElementById(`opt-${correctIndex}`).classList.add("correct");
    document.getElementById('takeaway-btn').disabled = true;
  for(let i=0;i<4;i++){
    const btn = document.getElementById(`opt-${i}`);
    btn.disabled = true;
  }
  setTimeout(()=>{ const prize = safeLine > 0 ? safeLine : 0; endGame(false,false, prize); },1200);
  }
}

function trigger5050(){
  playSound('lifeline');
  const btn5050 = document.getElementById("ll-5050");
  if(btn5050.disabled) return;
  btn5050.disabled = true;
  const correct = currentQuestionObj.correct;
  let elim = 0;
  while(elim < 2){
    let rand = Math.floor(Math.random()*4);
    const btn = document.getElementById(`opt-${rand}`);
    if(rand !== correct && !btn.disabled){
      btn.disabled = true;
      elim++;
    }
  }
}

function triggerAudience(){
  playSound('lifeline');
  const btn = document.getElementById("ll-audience");
  if(btn.disabled) return;
  btn.disabled = true;
  openModal('modal-audience');
  const correct = currentQuestionObj.correct;
  let pts = [5,5,5,5];
  let rem = 80;
  const bias = Math.floor(Math.random()*20)+40;
  pts[correct] += bias;
  rem -= bias;
  for(let i=0;i<3;i++){
    let c = Math.floor(Math.random()*rem);
    pts[i] += c;
    rem -= c;
  }
  pts[3] += rem;
  for(let i=0;i<4;i++){
    const bar = document.getElementById(`bar-${i}`);
    bar.style.height = "0px";
    setTimeout(()=>{ bar.style.height = `${pts[i]*1.1}px`; bar.innerText = `${pts[i]}%`; },100);
  }
}

function triggerFriend(){
  playSound('lifeline');
  const btn = document.getElementById("ll-friend");
  if(btn.disabled) return;
  btn.disabled = true;
  openModal('modal-friend');
  const correct = currentQuestionObj.correct;
  const letters = ["A","B","C","D"];
  const ans = (Math.random() < 0.85) ? letters[correct] : letters[(correct+1)%4];
  document.getElementById("friend-response").innerText = `「喂？我滿確定的，答案應該是 ${ans}！」`;
}

/* ============================
   Takeaway (見好就收)
   - stops timer, computes prize, opens save modal or directly shows rank
   ============================ */
function takeaway(){
  try { clearInterval(timerInterval); } catch(e){}
  let prize = 0;
  if (typeof currentLevel === 'number' && currentLevel > 0) {
    prize = moneyScale[Math.max(0, currentLevel - 1)] || 0;
  }
  pendingFinalPrize = prize;
  // disable takeaway to avoid double clicks
  document.getElementById('takeaway-btn').disabled = true;

  if (Number(prize) === 0) {
    saveLastResult({ prize: 0, level: currentLevel, date: new Date().toLocaleString() });
    alert('你選擇見好就收，最終獲得：$0');
    renderRankTable();
   // openRankModal();
    return;
  }

  document.getElementById('save-summary').innerText = `你選擇見好就收，最終獲得： $${Number(prize).toLocaleString()}（達成題數：${currentLevel}）`;
  document.getElementById('player-name').value = '';
  openModal('modal-save-name');
}

/* ============================
   End game & save flow
   ============================ */
function endGame(isTakeaway,isWinner,finalPrize){
  clearInterval(timerInterval);
  if(typeof finalPrize !== 'number'){
    if(isWinner) finalPrize = moneyScale[moneyScale.length-1];
    else if(isTakeaway) finalPrize = currentLevel === 0 ? 0 : moneyScale[currentLevel - 1];
    else finalPrize = safeLine > 0 ? safeLine : 0;
  }
  pendingFinalPrize = finalPrize;

  if(Number(finalPrize) === 0){
    saveLastResult({ prize: 0, level: currentLevel, date: new Date().toLocaleString() });
    alert(`遊戲結束！你最終獲得的獎金為: $0`);
    renderRankTable();
   // openRankModal();
    return;
  }
  document.getElementById('takeaway-btn').disabled = true;
  document.getElementById('save-summary').innerText = `你最終獲得： $${Number(finalPrize).toLocaleString()}（達成題數：${currentLevel}）`;
  document.getElementById('player-name').value = '';
  openModal('modal-save-name');
}

function confirmSaveName(){
  let name = document.getElementById('player-name').value.trim();
  if(!name) name = '匿名玩家';
  saveRanking(name, pendingFinalPrize, currentLevel);
  saveLastResult({ prize: pendingFinalPrize, level: currentLevel, date: new Date().toLocaleString() });
  closeModal('modal-save-name');
  renderRankTable();
  openRankModal();
}
function skipSave(){
  saveLastResult({ prize: pendingFinalPrize, level: currentLevel, date: new Date().toLocaleString() });
  closeModal('modal-save-name');
  renderRankTable();
 // openRankModal();
}

/* ============================
   Rankings & IO
   ============================ */
function saveRanking(name, prize, level){
  const rankings = getRankings();
  const entry = { name: name||'匿名玩家', prize: Number(prize)||0, level: Number(level)||0, date: new Date().toLocaleString() };
  rankings.push(entry);
  rankings.sort((a,b)=> b.prize - a.prize || b.level - a.level);
  saveRankings(rankings.slice(0,100));
}

function renderRankTable(){
  const tbody = document.getElementById('rank-tbody');
  if(!tbody) return;
  const rankings = getRankings();
  tbody.innerHTML = '';
  if(rankings.length === 0){
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#999">目前尚無紀錄</td></tr>`;
    return;
  }
  for(let i=0;i<Math.min(rankings.length,10);i++){
    const r = rankings[i];
    const lvl = (typeof r.level === 'number') ? r.level : (r.level ? Number(r.level) : 0);
    const prize = (typeof r.prize === 'number') ? r.prize : (r.prize ? Number(r.prize) : 0);
    const date = r.date || '-';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i+1}</td><td>${escapeHtml(r.name || '匿名玩家')}</td><td>$${prize.toLocaleString()}</td><td>${lvl}</td><td>${escapeHtml(date)}</td>`;
    tbody.appendChild(tr);
  }
}

function openRankModal(){ renderRankTable(); openModal('modal-rank'); }
function clearRankings(){ if(!confirm('確定要清除排行榜資料嗎？此動作無法復原。')) return; saveRankings([]); renderRankTable(); alert('🗑️ 排行榜已成功清空。'); }
function exportRankings(){ const data = getRankings(); const blob = new Blob([JSON.stringify(data,null,2)], { type:'application/json' }); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='millionaire_rankings.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
function importRankings(input){
  const file = input.files && input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(Array.isArray(parsed)){
        const normalized = parsed.map(it=>{
  return { name: it.name || '匿名玩家', prize: Number(it.prize)||0, level: Number(it.level)||0, date: it.date || new Date().toLocaleString() };
        });
        saveRankings(normalized);
        alert('📥 排行榜資料匯入成功！');
        renderRankTable();
      } else alert('格式錯誤，請提供正確的 JSON 陣列。');
    }catch(err){ alert('讀取檔案失敗！'); }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ============================
   Last result display
   ============================ */
function displayLastResult(){
  const el = document.getElementById('last-result');
  const last = getLastResult();
  if(last){ el.innerText = `上次遊玩：關卡 ${last.level || 0}，獲得 $${Number(last.prize||0).toLocaleString()}（${last.date}）`; } else el.innerText = '';
}

/* ============================
   Confetti
   ============================ */
const confettiCanvas = document.getElementById('confetti');
const confettiCtx = confettiCanvas.getContext ? confettiCanvas.getContext('2d') : null;
let confettiPieces = [];
function resizeConfetti(){ confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
function createConfetti(){ confettiPieces=[]; const count=Math.min(160,Math.floor(window.innerWidth/6)); for(let i=0;i<count;i++){ confettiPieces.push({ x:Math.random()*confettiCanvas.width, y:Math.random()*-confettiCanvas.height, r:Math.random()*6+4, d:Math.random()*50+10, color:['#ffd700','#00d2ff','#ff6b6b','#7cfc00'][Math.floor(Math.random()*4)], tilt:Math.random()*10-5, tiltSpeed:Math.random()*0.1+0.05 }); } }
let confettiAnim=null;
function drawConfetti(){ if(!confettiCtx) return; confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); confettiPieces.forEach(p=>{ confettiCtx.beginPath(); confettiCtx.fillStyle=p.color; confettiCtx.save(); confettiCtx.translate(p.x,p.y); confettiCtx.rotate(p.tilt*Math.PI/180); confettiCtx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); confettiCtx.restore(); p.y += Math.cos(p.d)+1+p.r/2; p.x += Math.sin(p.d); p.tilt += p.tiltSpeed; if(p.y>confettiCanvas.height+20){ p.y=-10; p.x=Math.random()*confettiCanvas.width; } }); confettiAnim=requestAnimationFrame(drawConfetti); }
function triggerConfetti(){ if(!confettiCtx) return; resizeConfetti(); createConfetti(); if(confettiAnim) cancelAnimationFrame(confettiAnim); drawConfetti(); setTimeout(()=>{ if(confettiAnim) cancelAnimationFrame(confettiAnim); confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); },4200); }
window.addEventListener('resize', ()=>{ resizeConfetti(); renderMoneyTree(); });

/* ============================
   Init
   ============================ */
window.onload = function(){
  migrateLegacyIfAny();
  gameQuestions = shuffleQuestions();
  renderMoneyTree();
  loadQuestion();
  renderRankTable();
  displayLastResult();
  resizeConfetti();
  document.querySelectorAll('.modal').forEach(m=>{ m.addEventListener('click', (e)=>{ if(e.target===m) m.style.display='none'; }); });
  // ensure takeaway button enabled
  const tb = document.getElementById('takeaway-btn'); if(tb) tb.disabled = false;
};
