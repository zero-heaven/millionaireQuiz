<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>誰想成為百萬富翁 - Deluxe Music Edition (Fixed Smooth Audience)</title>
<style>
    /* 同時針對所有連結狀態進行設定 */
    a, a:visited, a:hover, a:active {
      color: white !important;         /* 強制將字體顏色設為白色 */
      text-decoration: none !important; /* 移除超連結的底線 */
    }

:root {
  --primary: #050618; --secondary: #0e1154; --accent: #ffd700;
  --accent-glow: rgba(255, 215, 0, 0.3); --correct: #00ff66; --wrong: #ff3333;
  --text: #ffffff; --glass: rgba(255, 255, 255, 0.04); --glass-border: rgba(255, 255, 255, 0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background: radial-gradient(circle at center, #14165a 0%, var(--primary) 100%); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
header { padding: 15px 20px; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
h1 { font-size: 1.5rem; color: var(--accent); text-shadow: 0 0 8px var(--accent-glow); letter-spacing: 1px; }
.btn { background: linear-gradient(135deg, var(--secondary), #1d258c); border: 1px solid var(--accent); color: var(--text); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 0.9rem; }
.btn:hover { background: var(--accent); color: var(--primary); box-shadow: 0 0 12px var(--accent-glow); transform: translateY(-1px); }
.game-container { flex: 1; display: grid; grid-template-columns: 3fr 1fr; gap: 20px; padding: 20px; max-width: 1400px; width: 100%; margin: 0 auto; align-items: stretch; }
.glass-panel { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.main-game { display: flex; flex-direction: column; justify-content: space-between; gap: 15px; }
.status-bar { display: flex; justify-content: space-between; align-items: center; }
.lifelines { display: flex; gap: 10px; }
.lifeline-btn { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--accent); background: radial-gradient(circle, #171d7a 0%, #090c36 100%); color: var(--accent); font-weight: bold; font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
.lifeline-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 0 15px var(--accent-glow); color: #fff; border-color: #fff; }
.lifeline-btn:disabled { border-color: #444; color: #666; background: #111; cursor: not-allowed; opacity: 0.4; text-decoration: line-through; }

/* Timer styles and paused visual */
.timer-circle { width: 65px; height: 65px; border-radius: 50%; border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 8px var(--accent-glow); background: rgba(0,0,0,0.3); transition: border-color 220ms ease, box-shadow 220ms ease, transform 120ms ease; cursor: pointer; }
.timer-low { border-color: var(--wrong); color: var(--wrong); animation: pulse 1s infinite; }
.timer-paused { border-color: #ff3333 !important; box-shadow: 0 0 12px rgba(255,51,51,0.35); transform: scale(1.02); color: #ff3333; }

@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.question-box { text-align: center; font-size: 1.3rem; padding: 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); background: linear-gradient(90deg, rgba(14,17,84,0.6) 0%, rgba(6,7,44,0.8) 50%, rgba(14,17,84,0.6) 100%); margin-top: 20px; margin-bottom: 15px; line-height: 1.4; word-break: break-all; }
.answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answer-btn { background: linear-gradient(90deg, #0e1154 0%, #06072c 100%); border: 1px solid rgba(255,255,255,0.15); padding: 15px 20px; border-radius: 25px; color: #fff; text-align: left; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; }
.answer-btn:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 0 10px rgba(255,215,0,0.15); transform: translateY(-1px); }
.answer-btn span.prefix { color: var(--accent); font-weight: bold; margin-right: 8px; }
.answer-btn:disabled { opacity: 0.2; cursor: not-allowed; }
.answer-btn.selected { background: linear-gradient(90deg, #b8860b 0%, var(--accent) 100%); color: #000; border-color: #fff; }
.answer-btn.selected span.prefix { color: #000; }
.answer-btn.correct { background: linear-gradient(90deg, #006622 0%, var(--correct) 100%) !important; color: #fff !important; animation: flash 0.4s ease 3; }
.answer-btn.correct span.prefix { color: #fff !important; }
.answer-btn.wrong { background: linear-gradient(90deg, #990000 0%, var(--wrong) 100%) !important; color: #fff !important; }
.answer-btn.wrong span.prefix { color: #fff !important; }
@keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.sidebar { display: flex; flex-direction: column; gap: 15px; }
.money-list { display: flex; flex-direction: column-reverse; gap: 3px; flex: 1; justify-content: center; }
.money-item { display: flex; justify-content: space-between; padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; color: #888; background: rgba(255,255,255,0.01); }
.money-item.active { background: linear-gradient(90deg, #ff9900, var(--accent)); color: #000; box-shadow: 0 0 10px var(--accent-glow); transform: scale(1.02); }
.money-item.safe-line { color: #00ffcc; border-left: 3px solid #00ffcc; background: rgba(0, 255, 204, 0.03); }
.money-item.active.safe-line { color: #000; }

@media (max-width: 900px) {
  .game-container { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
  .sidebar { order: 0; }
  .money-list { display: none !important; } 
  .money-item { flex-direction: column; align-items: center; min-width: 75px; padding: 6px; border-radius: 8px; border-left: none; background: rgba(255,255,255,0.03); }
  .money-item.safe-line { border-left: none; border-bottom: 3px solid #00ffcc; }
  .question-box { font-size: 1.1rem; padding: 20px; }
  .answers-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .answer-btn { padding: 12px 18px; font-size: 0.95rem; }
  header { padding: 10px; } h1 { font-size: 1.2rem; }
}
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 999; align-items: center; justify-content: center; padding: 15px; }
.modal-content { background: radial-gradient(circle at top, #161b5e 0%, #080a33 100%); border: 2px solid var(--accent); border-radius: 16px; max-width: 500px; width: 100%; padding: 25px; text-align: center; }
.modal-title { font-size: 1.4rem; color: var(--accent); margin-bottom: 15px; }
.chat-box { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 10px; height: 180px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.chat-msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.95rem; line-height: 1.3; }
.chat-msg.player { background: #1e3c96; align-self: flex-end; border-bottom-right-radius: 2px; }
.chat-msg.friend { background: rgba(255,255,255,0.1); align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid var(--accent); }
/* 確保長條圖的容器有固定高度，並且是由下往上排列 */
.chart-container {
  display: flex;
  justify-content: space-around;
  align-items: flex-end; /* 關鍵：讓所有柱子從底部對齊 */
  height: 200px;         /* 填入你希望圖表擁有的總高度 */
  margin: 20px 0;
  padding-top: 25px;     /* 留空間給頂部的數字 */
}

/* 每一根柱子與文字的包裝外殼 */
.chart-bar-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end; /* 確保內容靠下對齊 */
  height: 100%;
  width: 50px;
}

/* 【最關鍵】長條圖本體：必須要有寬度、背景顏色、以及定位 */
/* 長條圖本體：升級為高質感綠色漸層風格 */
.chart-bar {
  width: 35px; /* 保持大氣的寬度 */
  
  /* 【核心修改】高質感綠色漸層色（左至右的科技感光澤） */
  background: linear-gradient(90deg, #11998e 0%, #38ef7d 50%, #11998e 100%);
  
  /* 綠色微發光邊框，增加精緻立體感 */
  border: 1px solid rgba(56, 239, 125, 0.8);
  border-radius: 6px 6px 0 0; /* 頂部微圓角 */
  height: 0%; /* 初始高度維持 0%，供 JS 動畫往上升 */
  
  /* 底部陰影與綠色能量發光特效 */
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 8px rgba(56, 239, 125, 0.3);
}

/* 調整底部的英文字母 A B C D 樣式，使其與綠色系完美搭配 */
.chart-label {
  font-size: 16px;
  font-weight: bold;
  margin-top: 8px;
  color: #a8ff78; /* 換成柔和的淺綠色，整體感更強 */
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
}

/* 數字標籤的樣式 */
.chart-value {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 5px;
  color: #ffffff; /* 改為純白色 */
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8), 0 0 5px rgba(0, 0, 0, 0.5); /* 加上黑色立體陰影，確保在任何背景下都極其清晰 */
  }

.vol-control { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #aaa; }

/* 請將下面的類名或 ID 換成你實際長條圖的 CSS 名稱 */
.audience-bar, [id^="bar-0-"] {
  width: 40px;
  background-color: #3498db;
  bottom: 0;
  /* 關鍵：設定高度改變時，在 1 秒內以緩動（ease-out）動畫流暢升起 */
  transition: height 1.2s ease-out; 
}

</style>
</head>
<body>
<header>
  <h1>百萬富翁 <span style="font-size:0.8rem; color:#888;" id="stageLevel">Welcome</span></h1>
  <div style="display:flex; align-items:center; gap:15px;">
    <div class="vol-control">🎵 <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.4" onchange="updateVolume(this.value)"></div>
    <button class="btn" onclick="resetGame()">開始</button>
  </div>
</header>

<div class="game-container">
  <div class="main-game glass-panel">
    <div class="status-bar">
      <button class="btn" id="takeaway-btn" onclick="takeawayMoney()">💰 提現</button>
      <div class="lifelines">
        <button class="lifeline-btn" id="life-5050" onclick="useLifeline('5050')">50:50</button>
        <button class="lifeline-btn" id="life-phone" onclick="useLifeline('phone')">📞 電話</button>
        <button class="lifeline-btn" id="life-audience" onclick="useLifeline('audience')">👥 觀眾</button>
      </div>
      <div class="timer-circle" id="timer">30</div>
    </div>

    <div class="question-box" id="question-text">載入中...</div>

    <div class="answers-grid">
      <button class="answer-btn" id="btn-0" onclick="selectAnswer(0)"><span class="prefix">A:</span><span class="text"></span></button>
      <button class="answer-btn" id="btn-1" onclick="selectAnswer(1)"><span class="prefix">B:</span><span class="text"></span></button>
      <button class="answer-btn" id="btn-2" onclick="selectAnswer(2)"><span class="prefix">C:</span><span class="text"></span></button>
      <button class="answer-btn" id="btn-3" onclick="selectAnswer(3)"><span class="prefix">D:</span><span class="text"></span></button>
    </div>
  </div>

  <div class="sidebar">
    <div class="glass-panel" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="money-list" id="money-list"></div>
    </div>

    <div class="glass-panel" style="max-height: 220px; display: flex; flex-direction: column; gap: 4px;">
      <h3 style="color: var(--accent); margin-bottom: 10px; text-align: center; font-size: 1rem;">🏅 Top 10 榮譽榜</h3>
      <div id="leaderboard-list" style="overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem;"></div>
    </div>

    <div class="glass-panel" style="padding:12px; display:flex; gap:8px;">
      <div style="position:relative; overflow:hidden; flex:1;">
        <button class="btn" style="width:100%; font-size:0.8rem; padding:6px 0;">📥 匯入 JSON</button>
        <input type="file" id="import-file" accept=".json" onchange="importJSON(event)" style="position:absolute; left:0; top:0; opacity:0; cursor:pointer; width:100%;">
      </div>
      <button class="btn" style="flex:1; font-size:0.8rem; padding:6px 0;" onclick="exportJSON()">📤 匯出 JSON</button>
    </div>
  </div>
</div>

<!-- Audience modal -->
<div class="modal" id="audience-modal">
  <div class="modal-content">
    <div class="modal-title">👥 觀眾投票</div>
    <div class="chart-container">
      <div class="chart-bar-wrapper"><div class="chart-value" id="val-0">0%</div><div class="chart-bar" id="bar-0"></div><div class="chart-label">A</div></div>
      <div class="chart-bar-wrapper"><div class="chart-value" id="val-1">0%</div><div class="chart-bar" id="bar-1"></div><div class="chart-label">B</div></div>
      <div class="chart-bar-wrapper"><div class="chart-value" id="val-2">0%</div><div class="chart-bar" id="bar-2"></div><div class="chart-label">C</div></div>
      <div class="chart-bar-wrapper"><div class="chart-value" id="val-3">0%</div><div class="chart-bar" id="bar-3"></div><div class="chart-label">D</div></div>
    </div>
    <button class="btn" onclick="closeModal('audience-modal')">返回</button>
  </div>
</div>

<!-- Phone modal -->
<div class="modal" id="phone-modal">
  <div class="modal-content">
    <div class="modal-title">📞 智囊團通話</div>
    <div class="chat-box" id="chat-box"></div>
    <button class="btn" id="phone-close-btn" style="display:none; margin-top:15px;" onclick="closeModal('phone-modal')">掛斷</button>
  </div>
</div>

<script>
/* =========================
   Core data & helpers
   ========================= */
const MONEY_LADDER = "1000,2000,3000,5000,10000,20000,30000,40000,60000,100000,150000,250000,500000,750000,1000000".split(",").map(Number);
const SAFE_LINES = "4,9".split(",").map(Number);

//set your audio sources if available
const audioWin = new Audio("sounds/win.mp3");
const audioAudience = new Audio("sounds/audience.mp3");
const audioPhone = new Audio("sounds/phone.mp3");
const audioLifeline = new Audio("sounds/lifeline.mp3");
const audioBg = new Audio("sounds/wait.mp3");
const audioCorrect = new Audio("sounds/correct.mp3");
const audioWrong = new Audio("sounds/wrong.mp3");
audioBg.loop = true;

function updateVolume(val) {
audioBg.volume = val * 0.4;
audioCorrect.volume = val * 0.4;
audioWrong.volume = val * 0.4; 
audioLifeline.volume = val * 0.5;
audioPhone.volume = val * 0.5;
audioAudience.volume = val * 0.5;
audioWin.volume = val * 0.7;
}

//Database
let questionsDb = [
  { "question": "【Form 1 數學】已知 a = -5，b = -3，求 a - b 的值是多少？", "answers": ["-8", "-2", "2", "8"], "correct": 1 },
  { "question": "【Form 1 數學】解方程：3x + 7 = 22，x 的值是多少？", "answers": ["3", "4", "5", "6"], "correct": 2 },
  { "question": "【Form 1 數學】一本原價 $150 的書以八折出售，現售價是多少？", "answers": ["$30", "$120", "$130", "$140"], "correct": 1 },
  { "question": "【Form 1 科學】在實驗室中，若不慎將酸性液體濺到皮膚上，應立即採取甚麼措施？", "answers": ["用大量清水沖洗", "塗抹強鹼溶液中和", "用乾布用力擦拭", "不需處理，等待自行風乾"], "correct": 0 },
  { "question": "【Form 1 常識】世界上面積最大的大洲是哪一個？", "answers": ["非洲", "歐洲", "亞洲", "北美洲"], "correct": 2 },
  { "question": "【Form 1 科學】下列哪一個結構是植物細胞獨有，而動物細胞沒有的？", "answers": ["細胞膜", "細胞核", "細胞質", "細胞壁"], "correct": 3 },
  { "question": "【Form 1 科學】水在攝氏多少度（常壓下）會開始沸騰轉化為水蒸氣？", "answers": ["0℃", "50℃", "100℃", "120℃"], "correct": 2 },
  { "question": "【Form 1 英文】Choose the correct sentence: They ______ to school every day.", "answers": ["walks", "walking", "walk", "is walking"], "correct": 2 },
  { "question": "【Form 1 英文】Identify the pronoun in this sentence: 'Mary lost her key.'", "answers": ["Mary", "lost", "her", "key"], "correct": 2 },
  { "question": "【Form 1 英文】What is the plural form of the word 'child'?", "answers": ["childs", "children", "childrens", "childes"], "correct": 1 },
  { "question": "【Form 2 數學】解聯立方程：x + y = 10 且 x - y = 4，求 x 的值。", "answers": ["3", "5", "7", "14"], "correct": 2 },
  { "question": "【Form 2 數學】直角三角形的兩條直角邊分別為 3cm 和 4cm，求斜邊的長度。", "answers": ["5cm", "6cm", "7cm", "25cm"], "correct": 0 },
  { "question": "【Form 2 數學】因式分解：x² - 9 的結果是甚麼？", "answers": ["(x-3)²", "(x+3)²", "(x-3)(x+3)", "(x-9)(x+1)"], "correct": 2 },
  { "question": "【Form 2 科學】人體內主要負責吸收營養物質的消化器官是甚麼？", "answers": ["胃", "大腸", "小腸", "食道"], "correct": 2 },
  { "question": "【Form 2 科學】當光線從空氣斜射入水中時，光線會發生甚麼現象？", "answers": ["反射", "折射", "繞射", "直線穿過"], "correct": 1 },
  { "question": "【Form 2 科學】在一個簡單串聯電路中，若其中一個燈泡壞了，其他燈泡會怎樣？", "answers": ["繼續發光", "變得更亮", "全部熄滅", "閃爍不定"], "correct": 2 },
  { "question": "【Form 2 英文】Choose the correct tense: While I ______ my homework, the phone rang.", "answers": ["do", "did", "was doing", "am doing"], "correct": 2 },
  { "question": "【Form 2 英文】Which word is the superlative form of 'good'?", "answers": ["better", "gooder", "best", "most good"], "correct": 2 },
  { "question": "【Form 2 英文】He failed the exam ______ he didn't study at all.", "answers": ["although", "because", "but", "so"], "correct": 1 },
  { "question": "【高一 數學】已知集合 A = {1, 2, 3}，B = {2, 3, 4}，求 A ∩ B（交集）。", "answers": ["{1, 4}", "{2, 3}", "{1, 2, 3, 4}", "{ }"], "correct": 1 },
  { "question": "【高一 數學】計算多項式 f(x) = x² - 4x + 3 在 x = 2 時的值。", "answers": ["-1", "0", "1", "3"], "correct": 0 },
  { "question": "【高一 數學】若 log₂x = 3，則 x 的值是多少？", "answers": ["5", "6", "8", "9"], "correct": 2 },
  { "question": "【高一 理化】根據週期表，原子序為 6 的元素（碳）屬於第幾週期？", "answers": ["第一週期", "第二週期", "第三週期", "第四週期"], "correct": 1 },
  { "question": "【高一 理化】一個質量為 2kg 的物體受到 10N 的外力作用，其加速度是多少 m/s²？", "answers": ["5", "10", "20", "0.2"], "correct": 0 },
  { "question": "【高一 理化】當物體做自由落體運動時（不計空氣阻力），其機械能（動能與位能之和）如何變化？", "answers": ["逐漸增加", "逐漸減少", "保持不變", "先增後減"], "correct": 2 },
  { "question": "【高一 英文】If I ______ more time, I would travel around the world.", "answers": ["have", "had", "will have", "have had"], "correct": 1 },
  { "question": "【高一 英文】The book ______ was written by Hemingway is very famous.", "answers": ["who", "which", "whom", "where"], "correct": 1 },
  { "question": "【高一 英文】______ the bad weather, they decided to go on a hike.", "answers": ["Despite", "Although", "Because of", "In order to"], "correct": 0 },
  { "question": "【Form 1 數學】若 x + 12 = 5，則 x 的值是多少？", "answers": ["7", "-7", "17", "-17"], "correct": 1 },

let gameQuestions = [], currentStage = 0, currentQuestion = null;
let timerInterval = null, timeLeft = 30, lifelinesUsed = {}, isAnswering = false;

/* =========================
   Leaderboard & UI init
   ========================= */
function updateLeaderboard(finalStageIndex) {
  let playerName = prompt("🏆 挑戰結束！請輸入您的大名進行登榜：", "Player1");
  if (playerName === null || playerName.trim() === "") playerName = "Player1";
  let prize = finalStageIndex >= 0 ? MONEY_LADDER[finalStageIndex] : 0;
  let leaderboard = JSON.parse(localStorage.getItem("millionaire_leaderboard")) || [];
  leaderboard.push({ name: playerName, stage: finalStageIndex + 1, prize: prize, date: new Date().toLocaleString('zh-TW', { dateStyle: 'short', timeStyle: 'short' }) });
  leaderboard.sort((a, b) => b.prize - a.prize);
  leaderboard = leaderboard.slice(0, 10);
  localStorage.setItem("millionaire_leaderboard", JSON.stringify(leaderboard));
  renderLeaderboard();
}

function renderLeaderboard() {
  const listEl = document.getElementById("leaderboard-list");
  if (!listEl) return;
  let leaderboard = JSON.parse(localStorage.getItem("millionaire_leaderboard")) || [];
  listEl.innerHTML = leaderboard.length === 0 ? `<div style="color:#666; text-align:center; padding:10px;">暫無戰績</div>` : "";
  leaderboard.forEach((rec, idx) => {
    let col = idx === 0 ? "color:#ffd700;" : idx === 1 ? "color:#c0c0c0;" : idx === 2 ? "color:#cd7f32;" : "color:#aaa;";
    
    // 👇 關鍵修正：將原本的字串依空格切開，只取第一部分的「日期」
    const dateOnly = rec.date ? rec.date.split(" ")[0] : "";

    const div = document.createElement("div");
    div.style = "display:flex; justify-content:space-between; padding:3px 6px; background:rgba(255,255,255,0.02); border-radius:4px;";
    div.innerHTML = `
       <span style="${col} font-weight:bold;">${idx+1} </span>
       <span style="${col} font-weight:bold;">${rec.name} </span>
       <span style="color:var(--accent); font-weight:bold;">$${rec.prize.toLocaleString()} (${rec.stage}關)</span>
       <span style="color:var(--accent); font-weight:bold;">${dateOnly} </span>
    `;
    listEl.appendChild(div);
  });
}

function initUI() {
  const ladderEl = document.getElementById("money-list"); ladderEl.innerHTML = "";
  MONEY_LADDER.forEach((amount, index) => {
    const item = document.createElement("div"); item.className = "money-item";
    if(SAFE_LINES.includes(index)) item.classList.add("safe-line");
    item.id = `money-stage-${index}`; item.innerHTML = `<span>${index + 1} 階</span><span>$${amount.toLocaleString()}</span>`;
    ladderEl.appendChild(item);
  });
  updateVolume(document.getElementById("vol-slider").value);
}

/* =========================
   Game flow: reset, load, select
   ========================= */
function resetGame() {
  if (typeof audioBg !== 'undefined' && audioBg.play) {
    audioBg.play().catch(e => {
      console.warn("背景音樂播放失敗：", e.message);
    });
  }

  try { clearInterval(timerInterval); timerInterval = null; } catch(e){}
  currentStage = 0; isAnswering = false;
  
  // 【新增】：重設遊戲時，將使用者手動暫停與外部暫停全部歸零
  _isPausedByUser = false;
  _externalPauseCount = 0;

  lifelinesUsed = { '5050': false, 'phone': false, 'audience': false };
  ['5050','phone','audience'].forEach(key => {
    const el = document.getElementById(`life-${key}`);
    if (el) { el.disabled = false; el.style.opacity = "1"; }
  });
  
  let pool = [...questionsDb];
  if (pool.length < 15) { while(pool.length < 15) pool = pool.concat([...questionsDb]); }
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  gameQuestions = pool.slice(0, 15);
  
  initUI(); 
  loadQuestion(); // 這裡面會觸發 startOrResumeTimer() 
}

function loadQuestion() {
  isAnswering = false; 
  timeLeft = 30;
  
  // 【新增】：每次載入新題目時，強制清空外部暫停計數，確保新的一題能正常倒數
  _externalPauseCount = 0; 
  
  updateTimerUI();
  document.getElementById("timer").classList.remove("timer-paused");
  
  for(let i=0; i<15; i++) {
    const el = document.getElementById(`money-stage-${i}`); if(!el) continue;
    el.className = "money-item";
    if(SAFE_LINES.includes(i)) el.classList.add("safe-line");
    if(i === currentStage) { 
      el.classList.add("active"); 
      if(window.innerWidth <= 900) el.scrollIntoView({ behavior: 'smooth', inline: 'center' }); 
    }
  }
  
  currentQuestion = gameQuestions[currentStage];
  document.getElementById("question-text").innerText = `${currentStage + 1} . ${currentQuestion.question}`;
  document.getElementById("stageLevel").innerText = `\n第 ${currentStage + 1}/15 關\n獎金:$${MONEY_LADDER[currentStage] }`;
  
  currentQuestion.answers.forEach((ans, index) => {
    const btn = document.getElementById(`btn-${index}`);
    if (btn) {
      // 【修正】：不要直接改 btn.innerText，而是改它裡面的 .text 元素
      const textSpan = btn.querySelector('.text');
      if (textSpan) {
        textSpan.innerText = ans;
      } else {
        // 後備機制：如果找不到 .text，才直接寫入（但正常情況下配合你的 HTML 會找到）
        btn.innerText = ans; 
      }
      
      btn.className = "answer-btn"; 
      btn.disabled = false;          
      btn.onclick = () => selectAnswer(index); 
    }
  });

  // 【修改這裡】：先徹底清除舊的執行緒，確保重置後能立即啟動
  stopTimerInterval();
  
  // 呼叫你原本的計時器啟動函式
  startOrResumeTimer();
}

/* =========================
   Timer: click to pause/resume; external pause stack
   ========================= */
let _isPausedByUser = false;
let _externalPauseCount = 0;

function updateTimerUI() {
  const timerEl = document.getElementById('timer');
  if (!timerEl) return;
  timerEl.textContent = String(timeLeft);
  if (timeLeft <= 10) timerEl.classList.add('timer-low'); else timerEl.classList.remove('timer-low');
  if (_isPausedByUser || _externalPauseCount > 0) timerEl.classList.add('timer-paused'); else timerEl.classList.remove('timer-paused');
}

function startOrResumeTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (_isPausedByUser || _externalPauseCount > 0) return;
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval); timerInterval = null;
      gameOver(true);
    }
  }, 1000);
}

function stopTimerInterval() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

document.addEventListener('DOMContentLoaded', () => {
  const timerEl = document.getElementById('timer');
  if (timerEl) {
    timerEl.style.cursor = 'pointer';
    timerEl.addEventListener('click', () => {
      _isPausedByUser = !_isPausedByUser;
      if (_isPausedByUser) stopTimerInterval();
      else if (_externalPauseCount === 0) startOrResumeTimer();
      updateTimerUI();
    });
  }
});

window._pauseGameTimer = function () { _externalPauseCount++; stopTimerInterval(); updateTimerUI(); };
window._resumeGameTimer = function () { if (_externalPauseCount > 0) _externalPauseCount--; if (_externalPauseCount === 0 && !_isPausedByUser) startOrResumeTimer(); updateTimerUI(); };

window.gameTimer = {
  pause: () => { _isPausedByUser = true; stopTimerInterval(); updateTimerUI(); },
  resume: () => { _isPausedByUser = false; if (_externalPauseCount === 0) startOrResumeTimer(); updateTimerUI(); },
  set: (sec) => { timeLeft = sec; updateTimerUI(); },
  getRemaining: () => timeLeft,
  isPaused: () => _isPausedByUser || _externalPauseCount > 0
};

/* =========================
   Smooth audience animation helper
   ========================= */
function animateAudienceBars(percentages) {
  const duration = 1200; // 動畫總共跑 1.2 秒
  const startTime = performance.now();

  function updateAnimation(currentTime) {
    const elapsedTime = currentTime - startTime;
    // 計算目前的進度比例 (0 到 1)
    const progress = Math.min(elapsedTime / duration, 1);
    
    // 緩動函數 (Ease-Out) 讓動畫結尾更柔和流暢
    const easeOutProgress = 1 - Math.pow(1 - progress, 3);

    for (let i = 0; i < 4; i++) {
      const bar = document.getElementById(`bar-${i}`);
      const valText = document.getElementById(`val-${i}`);
      const targetPercent = percentages[i];

      // 計算當前進度對應的高度與百分比數字
      const currentHeight = targetPercent * easeOutProgress;
      const currentNum = Math.floor(targetPercent * easeOutProgress);

      if (bar) bar.style.height = `${currentHeight}%`;
      if (valText) valText.textContent = `${currentNum}%`;
    }

    // 如果時間還沒到 1.2 秒，持續渲染下一影格
    if (progress < 1) {
      requestAnimationFrame(updateAnimation);
    }
  }

  // 啟動流暢的影格動畫
  requestAnimationFrame(updateAnimation);
}

/* =========================
   Answer selection
   ========================= */
function selectAnswer(idx) { // 將參數改為直觀的 idx
  if (isAnswering) return; 
  isAnswering = true; 
  stopTimerInterval();
  
  const selectedBtn = document.getElementById(`btn-${idx}`); 
  if (selectedBtn) selectedBtn.classList.add("selected");
  
  setTimeout(() => {
    // 移除 shuffledMapping，直接比對當前點擊的索引是否等於正確答案
    const isCorrect = (idx === currentQuestion.correct);
    
    if (isCorrect) {
      try { audioCorrect.play(); } catch(e){}
      if (selectedBtn) selectedBtn.className = "answer-btn correct";
      
      setTimeout(() => {
        if (currentStage === 14) {
        try { audioWin.play(); } catch(e){}
          alert("🏆 恭喜！你成功突破第15階，奪得大獎！");
          updateLeaderboard(14);
          resetGame();
        } else {
          currentStage++; 
          loadQuestion();
        }
      }, 1200);
    } else {
      try { audioWrong.play(); } catch(e){}
      if (selectedBtn) selectedBtn.className = "answer-btn wrong";
      
      // 答錯時，直接找出正確答案的按鈕（0-3）並亮起綠燈
      for(let i=0; i<4; i++) {
        if (i === currentQuestion.correct) {
          const b = document.getElementById(`btn-${i}`); 
          if (b) b.classList.add("correct");
        }
      }
      setTimeout(() => { gameOver(false); }, 1200);
    }
  }, 900);
}

/* =========================
   Lifelines: 50:50, phone, audience
   ========================= */
function useLifeline(type) {
  if (isAnswering) return;
  if (!lifelinesUsed) lifelinesUsed = {};
  lifelinesUsed[type] = true;
  const btn = document.getElementById(`life-${type}`);
  if (btn) { btn.disabled = true; btn.style.opacity = "0.6"; }

  if (type === '5050') {
   try { audioLifeline.play(); } catch(e){}
    let wrong = [];
    for (let i = 0; i < 4; i++) {
      // 移除 shuffledMapping：直接比對 i 是否不等於正確答案的索引
      if (i !== currentQuestion.correct) wrong.push(i);
    }
    wrong.sort(() => Math.random() - 0.5);
    wrong.slice(0, 2).forEach(idx => {
      const el = document.getElementById(`btn-${idx}`);
      if (el) el.disabled = true;
    });
    
  } else if (type === 'phone') {
     try { audioPhone.play(); } catch(e){}
    if (typeof window._pauseGameTimer === 'function') window._pauseGameTimer();
    const phoneModal = document.getElementById("phone-modal");
    const box = document.getElementById("chat-box");
    const phoneCloseBtn = document.getElementById("phone-close-btn");
    if (!box || !phoneModal) { if (typeof window._resumeGameTimer === 'function') window._resumeGameTimer(); return; }
    box.innerHTML = "";
    if (phoneCloseBtn) phoneCloseBtn.style.display = "none";
    phoneModal.style.display = "flex";

    const phoneDialogs = [
      "我剛剛問過AI大臣，佢覺得答案是",
      "我昨天睡不好，不過我的第一印象答案是",
      "有冇攪錯… 咁簡單的問題都唔識。答案是",
      "老友！嗯…… 答案是",
      "我 100% 確定！除非唔喺？答案是",
      "哇！這條問題實在太無聊… 斷估答案是",
      "我不太明白這條問題。但我認為答案是",
      "我只是猜測，我認為答案是",
      "直覺話我知，答案就是",
      "這條是什麼白痴問題。我認為答案是"
    ];
    const idx = Math.floor(Math.random() * phoneDialogs.length);
    const chosen = phoneDialogs[idx];
    
    // 移除 shuffledMapping：正確答案的索引直接就是對應 ABCD 的字母
    const letter = "ABCD"[currentQuestion.correct];
    
    const staged = [
      { r: 'player', t: "老張！快幫我想想這題！" },
      { r: 'friend', t: chosen + (chosen.includes(letter) ? "" : ` … ${letter}`) }
    ];
    staged.forEach((l, i) => {
      setTimeout(() => {
        const m = document.createElement("div");
        m.className = `chat-msg ${l.r}`;
        m.innerText = l.t;
        box.appendChild(m);
        box.scrollTop = box.scrollHeight;
        if (i === staged.length - 1 && phoneCloseBtn) phoneCloseBtn.style.display = "inline-block";
      }, (i + 1) * 900);
    });
    
  } else if (type === 'audience') {
      try { audioAudience.play(); } catch(e){}
    if (typeof window._pauseGameTimer === 'function') window._pauseGameTimer();
    const audienceModal = document.getElementById("audience-modal");
    if (!audienceModal) { if (typeof window._resumeGameTimer === 'function') window._resumeGameTimer(); return; }
    
    let cIdx = currentQuestion.correct;

    function generateDistribution(correctIndex) {
      const base = [Math.random(), Math.random(), Math.random(), Math.random()];
      const sum = base.reduce((a,b)=>a+b,0);
      let perc = base.map(x => Math.floor((x / sum) * 100));
      if (typeof correctIndex === 'number') {
        const boost = 18 + Math.floor(Math.random() * 12);
        perc[correctIndex] = Math.min(90, perc[correctIndex] + boost);
      }
      let total = perc.reduce((a,b)=>a+b,0);
      let diff = 100 - total;
      while (diff !== 0) {
        const idx = Math.floor(Math.random() * 4);
        if (diff > 0) { perc[idx]++; diff--; }
        else { if (perc[idx] > 0) { perc[idx]--; diff++; } }
      }
      return perc;
    }

    const p = generateDistribution(cIdx);
    
    // 1. 動畫初始化：在顯示前，先將 4 個長條圖的高度歸零，文字設為 0% [3]
    for (let i = 0; i < 4; i++) {
      const bar = document.getElementById(`bar-${i}`); // 正確對應你的 HTML ID [3]
      const valText = document.getElementById(`val-${i}`); // 正確對應你的 HTML ID [3]
      if (bar) bar.style.height = "0%";
      if (valText) valText.innerText = "0%";
    }

    // 2. 顯示彈出視窗
    audienceModal.style.display = 'flex';
    
    // 3. 延遲 50 毫秒後，觸發長條圖升起與數字跑馬燈增加的動效 [3]
    setTimeout(() => {
      // 呼叫下方我們重新寫好的動畫函式 [3]
      animateAudienceBars(p); 
    }, 50);
  }
}


/* =========================
   Modal close helper
   ========================= */
function closeModal(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = "none";
  if (id === 'audience-modal' || id === 'phone-modal') {
    if (typeof window._resumeGameTimer === 'function') window._resumeGameTimer();
  }
}

/* =========================
   Game over & takeaway
   ========================= */
function gameOver(isTimeout) {
  try { clearInterval(timerInterval); timerInterval = null; } catch(e){}
  if (isTimeout) { try { audioWrong.play(); } catch(e){} }

  let earnedIdx = -1;
  SAFE_LINES.forEach(lineIdx => { if (currentStage > lineIdx) earnedIdx = lineIdx; });
  alert(isTimeout ? "⏱️ 作答超時！挑戰結束。" : "💥 答錯了！挑戰結束。");

  if (currentStage === 0 || earnedIdx === -1) return;
  updateLeaderboard(earnedIdx);
}

function takeawayMoney() {
  if (isAnswering || currentStage === 0) return;
  try { clearInterval(timerInterval); timerInterval = null; } catch(e){}
  const prize = MONEY_LADDER[currentStage - 1] || 0;
  alert(`💰 提現離開成功！抱走獎金：$${prize.toLocaleString()}`);
  updateLeaderboard(currentStage - 1);
  resetGame();
}

/* =========================
   Import / Export JSON
   ========================= */
function exportJSON() {
  let leaderboardData = JSON.parse(localStorage.getItem("millionaire_leaderboard")) || [];
  if (leaderboardData.length === 0) { alert("⚠️ 目前排行榜尚無任何榮譽紀錄可供匯出！"); return; }
  const blob = new Blob([JSON.stringify(leaderboardData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "millionaire_scoreboard_records.json";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  alert("📤 排行榜歷史紀錄已成功導出為 JSON 檔案！");
}

function importJSON(e) {
  const files = e.target.files;
  if (!files || files.length === 0) return;
  const file = files[0];
  const r = new FileReader();
  r.onload = function(evt) {
    try {
      const json = JSON.parse(evt.target.result);
      if (Array.isArray(json) && json.length > 0 && json[0].prize !== undefined) {
        localStorage.setItem("millionaire_leaderboard", JSON.stringify(json));
        alert(`📥 成功匯入歷史排行榜紀錄！共計 ${json.length} 筆戰績。`);
        if (typeof renderLeaderboard === "function") renderLeaderboard();
      } else {
        alert("⚠️ JSON 結構不符合排行榜紀錄格式！");
      }
    } catch (err) {
      alert("❌ 解析 JSON 排行榜檔案失敗！");
    }
  };
  r.readAsText(file);
}

/* =========================
   Download helper
   ========================= */
document.addEventListener('DOMContentLoaded', () => {
  const dlBtn = document.getElementById('download-fixed-btn');
  if (!dlBtn) return;
  dlBtn.addEventListener('click', () => {
    const docHtml = '<!doctype html>\\n' + document.documentElement.outerHTML;
    const blob = new Blob([docHtml], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'millionaire_game_fixed.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
});

/* UX: close modals on background click / ESC */
document.addEventListener('click', (e) => {
  const audienceModal = document.getElementById('audience-modal');
  const phoneModal = document.getElementById('phone-modal');
  if (audienceModal && audienceModal.style.display === 'flex' && e.target === audienceModal) closeModal('audience-modal');
  if (phoneModal && phoneModal.style.display === 'flex' && e.target === phoneModal) closeModal('phone-modal');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('audience-modal')?.style.display === 'flex') closeModal('audience-modal');
    if (document.getElementById('phone-modal')?.style.display === 'flex') closeModal('phone-modal');
  }
});

/* Initialize */
window.addEventListener('load', function() {
  try { initUI(); renderLeaderboard(); resetGame(); } catch(e) { console.error(e); }
});
